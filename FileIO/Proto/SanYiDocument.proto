syntax = "proto3";

package sanyi.proto;

// ============================================================
// SanYi Document 序列化协议定义
// 版本: 2
// 用于 .sy 文件的二进制序列化/反序列化
//
// 设计原则:
//   1. 所有字段使用 proto3 语法，默认值自动处理
//   2. 广泛使用 repeated/repeated map 支持扩展
//   3. 保留 reserved 字段用于未来兼容
//   4. oneof 用于区分图元类型，保证类型安全
//
// ============================================================
// 字段号是唯一不可逆的东西
// ============================================================
// 其余一切（结构、命名、语义）都能靠"新字段 + 旧字段降级读取"演进，
// 唯独字段号：一旦某个号被用掉又被删，就只能 reserved 掉，永远不能再赋给别的含义。
// 因此本文件新增字段时遵守三条：
//   1. 新增只用本 message 里连续的空号，并且一次性把该 message 的"未来可能字段"
//      全部规划进来（哪怕本次不用，也先占号，见各 message 末尾的 reserved）；
//   2. 删除字段时改为 reserved，并在注释里写明它曾经的含义；
//   3. 语义变更不改字段号，而是新增字段 + 旧字段标记 legacy。
//
// v2 相对 v1 的变化（全部是纯新增，v1 文件可被 v2 读取）：
//   - 新增 ProcessData / ProcessParamsData：工艺（加工参数）成为一等文档对象
//     （v1 把工艺参数挂在图层上，无法表达"同层不同参数"和"多工序"）
//   - LayerData 新增 output / default_process_id
//   - EntityData 新增 process_id（图元级覆盖，本次预留）
//   - DocumentMetadata 新增 units（文档长度单位，几何恒为 mm）
//   - 新增 ProjectSettings（机器档案引用，仅用于追溯）
//   - HardwareInfo 降级为 legacy（只保留读取兼容，不再写入新字段）
// ============================================================

option optimize_for = LITE_RUNTIME;  // 减少生成代码体积，适合移动/嵌入式

// ---------------------------- 基础类型 ----------------------------

// 二维向量 (double)
message Vec2d {
    double x = 1;
    double y = 2;
}

// RGB 颜色 (float)
message Vec3f {
    float r = 1;
    float g = 2;
    float b = 3;
}

// 三维向量 (float)
message Vec3fData {
    float x = 1;
    float y = 2;
    float z = 3;
}

// 二维浮点向量 (float)
message Vec2fData {
    float x = 1;
    float y = 2;
}

// 可扩展的字符串键值对 (用于所有层级的 custom_properties)
message PropertyEntry {
    string key = 1;
    string value = 2;
}

// ---------------------------- 文档元信息 ----------------------------

message DocumentMetadata {
    // === 版本信息 ===
    int32  version           = 1;   // SY 文件格式版本 (当前: 1)
    int32  file_version      = 2;   // 应用文件版本号

    // === 作者/软件信息 ===
    string author            = 3;   // 作者名称
    string software_name     = 4;   // 软件名称 (如 "SanYi CAD")
    string software_version  = 5;   // 软件版本 (如 "1.0.0")

    // === 时间信息 (ISO 8601 格式) ===
    string created_time      = 6;   // 创建时间，如 "2024-01-15T10:30:00+08:00"
    string modified_time     = 7;   // 最后修改时间

    // === 环境信息 ===
    string operating_system  = 8;   // 操作系统，如 "Windows 10", "Ubuntu 22.04"

    // === 文档描述 ===
    string description       = 9;   // 文档描述/备注

    // === 未来扩展 ===
    repeated PropertyEntry custom_properties = 10;  // 任意键值对扩展

    // === 环境溯源信息 ===
    string serial_number     = 11;  // 设备序列号 (用于追溯文件来源设备)
    string computer_username = 12;  // 创建/修改文件的电脑用户名
    string os_version        = 13;  // 操作系统版本详情 (如 "Windows 11 23H2", "macOS 14.5")

    // === 长度单位 (v2 新增) ===
    // 文档声明的长度单位。**几何坐标恒为毫米**，本字段只记录"用户以为自己在用什么单位"，
    // 用于界面显示与导入校验；写入方目前恒填 0，读取方遇到 1 必须给出"暂不支持英制文档"的
    // 显式错误，而不是按毫米静默读入（那会让整份图小 25.4 倍）。
    //   0 = mm（默认，恒等）
    //   1 = inch（保留，未实现）
    int32  units             = 14;

    bytes  reserved          = 20;  // 保留用于未来结构扩展
    reserved 21 to 29;              // v2 占位：直接在 21..29 号扩展，不要复用 20
}

// ---------------------------- 图层 ----------------------------

message LayerData {
    uint32 id               = 1;   // 图层唯一标识
    string name             = 2;   // 图层名称 (UTF-8)
    uint32 color            = 3;   // ARGB 颜色值
    bool   visible          = 4;   // 可见性
    bool   locked           = 5;   // 锁定状态
    repeated PropertyEntry custom_properties = 6;  // 图层扩展属性
    uint32 layer_type       = 7;   // 图层类型 (0=VECTOR, 1=BITMAP)
    bool   fill             = 8;   // 是否填充图层
    uint32 fill_color       = 9;   // 填充颜色 ARGB

    // === v2 新增：加工语义 ===
    // 是否输出到设备。**与 visible 严格分离**：
    //   - visible=false, output=true  → 不显示但要加工（模板/定位辅助线常见需求）
    //   - visible=true,  output=false → 显示但不加工（尺寸标注、参考底图）
    // v1 文件没有本字段，读取方按 proto3 默认 false 处理会**导致旧文件整体不加工**，
    // 因此读端必须用 has 语义兜底：字段缺失时回退为 true（见 SySerializer 的迁移分支）。
    optional bool output    = 10;

    // 本图层默认使用的工艺 ID；0 表示"未指定，使用工程默认工艺"
    uint32 default_process_id = 11;

    reserved 12 to 19;              // v2 占位
}

// ---------------------------- 硬件信息 ----------------------------

// 【legacy / 只读】v1 的硬件快照。
// 保留字段号与读取路径，但 v2 起不再新增内容：真正的机器身份属于"机器档案"
// （Main/Src/Hardware/MachineProfile，装在现场的 JSON），不属于文档；
// 文档只通过 ProjectSettings.machine_profile_ref 记录"这份图是为哪台机器出的"。
message HardwareInfo {
    string laser_type         = 1;   // 激光类型 (如 "CO2", "Fiber")
    string controller_model   = 2;   // 控制器型号
    double max_power          = 3;   // 最大功率 (瓦)
    double work_area_width    = 4;   // 工作区域宽度 (mm)
    double work_area_height   = 5;   // 工作区域高度 (mm)
    repeated PropertyEntry custom_properties = 6;  // 硬件扩展属性
    bytes  reserved           = 20;  // 保留
}

// ---------------------------- 工艺（v2 新增） ----------------------------

// 一组加工参数的快照。字段与 Engine/Common/Include/Engine/Process/ProcessParams.h
// 的 Eg::ProcessParams 一一对应，改动必须两边同步（有单测比对支持的键集合）。
//
// 单位约定与 HAL 一致：长度 mm、角度 度、速度 mm/s、频率 Hz、时间 微秒。
message ProcessParamsData {
    // 参数集名称。只用于日志与追溯（"这份图当时用的哪套参数"），不参与加工。
    string name             = 1;

    // 是否参与加工。false = 该工艺被停用（保留参数但不产出刀路）
    bool   enabled          = 2;

    double power_percent    = 3;   // 出光功率百分比 0–100
    double speed_mm_per_sec = 4;   // 进给速度，必须 > 0
    double frequency_hz     = 5;   // 脉冲频率；CW 激光器填 0
    double pulse_width_us   = 6;   // 脉宽；CW 激光器填 0
    int32  waveform_index   = 7;   // 波形序号（MOPA）
    int32  passes           = 8;   // 加工遍数，>= 1

    // 填充/扫描：fill_enabled=true 时按 fill_interval_mm 的行距在区域上扫描
    bool   fill_enabled     = 9;
    double fill_interval_mm = 10;  // 填充行距（mm），> 0
    double fill_angle_deg   = 11;  // 填充角度（度）
    int32  fill_mode        = 12;  // 0=轮廓, 1=双向扫描, 2=光栅

    // 割缝补偿半径（mm）。> 0 外扩，< 0 内缩；0 = 不补偿。
    // 方向由轮廓绕向决定（外环外扩、孔洞内缩），不由符号决定 —— 符号只是"额外偏移"。
    double kerf_mm          = 13;

    // 空移速度（mm/s），= 0 时使用工程默认值
    double rapid_speed_mm_per_sec = 14;

    repeated PropertyEntry custom_properties = 20;
    reserved 21 to 49;             // v2 占位：新增参数直接用 21..49，不要塞进 custom_properties
}

// 工艺对象：一段"用什么参数、加工哪些目标、按什么顺序"。
//
// 设计要点（为什么工艺不是图层属性）：
//   - 同一图层可能需要两种参数（先标刻后切割），挂图层表达不了；
//   - 同一批图元可能要加工两次（粗加工 + 精修），挂图层表达不了；
//   - 图层是「组织/显示」概念，工艺是「加工」概念，两者生命周期不同。
// 图层只作为**默认绑定**的快捷方式（LayerData.default_process_id），
// 目标集合为空时表示"本工艺对所有绑定到它的图层生效"。
message ProcessData {
    uint32 id       = 1;   // 工艺 ID，文档内唯一，>= 1
    string name     = 2;   // 工艺名称（界面显示）
    ProcessParamsData params = 3;

    // 显式目标图层（与 default_process_id 反向绑定二选一，两者同时存在时本字段优先）
    repeated uint32 target_layer_ids  = 4;
    // 显式目标图元（图元级覆盖，一般留空）
    repeated uint64 target_entity_ids = 5;

    // 工序顺序，小者先执行。同值时按图层顺序，再按场景顺序（稳定排序）
    int32  order    = 6;
    // 是否输出到设备（与 LayerData.output 是"与"关系：任一为 false 则不加工）
    bool   output   = 7;

    repeated PropertyEntry custom_properties = 8;
    reserved 20 to 49;
}

// 工程级设置：不影响几何，但影响"这份图会被怎么送去加工"。
message ProjectSettings {
    // 机器档案引用（SANYI_MACHINE_PROFILE 的 deviceId 或档案文件名）。
    // 仅用于追溯"这份图是为哪台机器出的"，**不参与坐标换算** ——
    // 坐标换算的唯一依据是本机装配时的机器档案，不是文档里的这个字符串。
    string machine_profile_ref = 1;
    // 默认工艺 ID（图层与图元都没指定工艺时使用）；0 = 无
    uint32 default_process_id  = 2;

    repeated PropertyEntry custom_properties = 4;
    reserved 20 to 49;
}

// ---------------------------- 图元类型枚举 ----------------------------

enum EntityType {
    ENTITY_UNKNOWN    = 0;
    ENTITY_POINT      = 1;
    ENTITY_LINE       = 2;
    ENTITY_POLYGON    = 3;
    ENTITY_ARC        = 4;
    ENTITY_CIRCLE     = 5;
    ENTITY_ELLIPSE    = 6;
    ENTITY_BEZIER2    = 7;
    ENTITY_BEZIER     = 8;
    ENTITY_SPLINE     = 9;
    ENTITY_NURBS      = 10;
    ENTITY_SMARTLINE  = 11;
    ENTITY_TEXT       = 12;
    ENTITY_BAR_CODE   = 13;
    ENTITY_QR_CODE    = 14;
    ENTITY_IMAGE      = 15;
    ENTITY_MESH       = 16;   // 3D 网格图元
    ENTITY_GROUP      = 17;   // 群组
}

// ---------------------------- 各图元特有数据 ----------------------------

message PointData {
    // 点图元没有额外数据，位置由父消息的 base_point 表示
}

message LineData {
    repeated Vec2d points = 1;   // 顶点列表
}

message PolygonData {
    repeated Vec2d vertices     = 1;   // 顶点列表
    int32  sides                = 2;   // 边数
    double circum_radius        = 3;   // 外接圆半径
}

message ArcData {
    double radius       = 1;   // 半径
    double start_angle  = 2;   // 起始角 (弧度)
    double end_angle    = 3;   // 结束角 (弧度)
}

message CircleData {
    double radius = 1;   // 半径
}

message EllipseData {
    double radius_x  = 1;   // X 半轴
    double radius_y  = 2;   // Y 半轴
    double rotation  = 3;   // 旋转角 (弧度)
}

message Bezier2Data {
    Vec2d ctrl = 1;   // 控制点
    Vec2d end  = 2;   // 终点
}

message BezierData {
    Vec2d ctrl0 = 1;   // 控制点 1
    Vec2d ctrl1 = 2;   // 控制点 2
    Vec2d end   = 3;   // 终点
}

message SplineData {
    int32  degree          = 1;   // 曲线阶数
    repeated double knots         = 2;   // 节点向量
    repeated double weights       = 3;   // 权重向量
    repeated Vec2d control_points = 4;   // 控制点向量
}

message NurbsData {
    int32  degree          = 1;   // 曲线阶数
    repeated double knots         = 2;   // 节点向量
    repeated double weights       = 3;   // 权重向量
    repeated Vec2d control_points = 4;   // 控制点向量
}

// SmartLine 递归包含子图元
message SmartLineData {
    repeated EntityData segments = 1;   // 子图元列表
}

message TextData {
    string font_name   = 1;   // 字体名称
    double height      = 2;   // 文本高度
    double rotation    = 3;   // 旋转角 (弧度)
    int32  h_align     = 4;   // 水平对齐: 0=Left, 1=Center, 2=Right
    int32  v_align     = 5;   // 垂直对齐: 0=Baseline, 1=Top, 2=Middle, 3=Bottom
    bool   bold        = 6;   // 加粗
    bool   italic      = 7;   // 斜体
    string text        = 8;   // 文本内容 (UTF-8)
}

message BarCodeData {
    string data    = 1;   // 条码内容
    double width   = 2;   // 条码宽度
    double height  = 3;   // 条码高度
}

message QRCodeData {
    string data         = 1;   // 二维码内容
    double module_size  = 2;   // 模块尺寸
    optional int32 ecc          = 3;  // 纠错等级 0=L 1=M 2=Q 3=H（缺省读端回落 M）
    optional int32 border_size  = 4;  // 静区宽度（模块数，缺省读端回落 4）
}

message ImageData {
    int32  width        = 1;   // 图像宽度 (像素)
    int32  height       = 2;   // 图像高度 (像素)
    int32  pixel_format = 3;   // 像素格式: 0=Unknown, 1=Gray8, 2=RGB24, 3=RGBA32
    bytes  pixel_data   = 4;   // 原始像素数据
    Vec2d  top_left     = 5;   // 左上角
    Vec2d  top_right    = 6;   // 右上角
    Vec2d  bottom_left  = 7;   // 左下角
    Vec2d  bottom_right = 8;   // 右下角
}

// 3D 网格图元数据
message MeshData {
    string name                  = 1;   // 网格名称
    repeated Vec3fData vertices  = 2;   // 顶点位置
    repeated Vec3fData normals   = 3;   // 顶点法线
    // 材质属性
    float  ambient_r = 10;
    float  ambient_g = 11;
    float  ambient_b = 12;
    float  diffuse_r = 13;
    float  diffuse_g = 14;
    float  diffuse_b = 15;
    float  specular_r = 16;
    float  specular_g = 17;
    float  specular_b = 18;
    float  shininess = 19;
    repeated PropertyEntry custom_properties = 20;  // 扩展属性
}

// 群组数据
message GroupData {
    uint64 id                = 1;   // 群组唯一标识
    string name              = 2;   // 群组名称
    repeated uint64 entity_ids = 3; // 直接成员图元 ID 列表
    repeated uint64 sub_group_ids = 4; // 子群组 ID 列表
    uint64 parent_group_id   = 5;   // 父群组 ID（0 表示顶层群组）
}

// ---------------------------- 图元通用结构 ----------------------------

// 轴对齐包围盒（图元包围盒缓存的持久化载体）
message BBoxData {
    Vec2d min_pt = 1;  // 左下角
    Vec2d max_pt = 2;  // 右上角
}

// 所有图元使用此消息，通过 oneof 区分具体类型
message EntityData {
    // === 通用属性 ===
    EntityType type       = 1;    // 图元类型
    uint64     id         = 2;    // 图元唯一标识
    uint32     layer_id   = 3;    // 所属图层 ID
    Vec2d      base_point = 4;    // 基点坐标
    Vec3f      color      = 5;    // 图元颜色 (RGB)
    bool       closed     = 6;    // 是否闭合
    bool       ccw        = 7;    // 是否逆时针方向
    repeated PropertyEntry custom_properties = 8;  // 扩展属性
    string   name             = 9;    // 图元名称

    // === 类型特有数据 (oneof 保证互斥，节省空间) ===
    oneof type_specific {
        PointData      point_data      = 10;
        LineData       line_data       = 11;
        PolygonData    polygon_data    = 12;
        ArcData        arc_data        = 13;
        CircleData     circle_data     = 14;
        EllipseData    ellipse_data    = 15;
        Bezier2Data    bezier2_data    = 16;
        BezierData     bezier_data     = 17;
        SplineData     spline_data     = 18;
        NurbsData      nurbs_data      = 19;
        SmartLineData  smartline_data  = 20;
        TextData       text_data       = 21;
        BarCodeData    barcode_data    = 22;
        QRCodeData     qrcode_data     = 23;
        ImageData      image_data      = 24;
        MeshData       mesh_data       = 25;
    }

    // === 加载加速数据（可选） ===
    // 包围盒缓存：写入方为保存时的真实包围盒；读取方据此跳过 computeBBox()
    // （Bezier/Spline/NURBS 等曲线图元的包围盒需离散化，批量加载时开销显著）。
    //
    // 兼容性说明：
    //   - 旧版本软件读新文件：protobuf 未知字段自动忽略，行为退化为"现场计算"，无影响。
    //   - 新版本软件读旧文件：字段缺失，has_cached_bbox() 为 false，同样现场计算。
    //   - 数据正确性：.sy 的 CRC32 覆盖整个 payload，校验失败即拒绝加载，
    //     因此通过校验的文件其 cached_bbox 必然与几何数据来自同一次写入。
    optional BBoxData cached_bbox = 26;

    // === v2 新增：图元级工艺覆盖 ===
    // 0 / 缺失 = 跟随所属图层的 default_process_id，再退到工程默认工艺。
    // 本次（v2）只落字段与读写，界面暂不开放入口；先占号是为了避免以后为一个
    // "其实早该有"的能力再升一次格式版本。
    optional uint32 process_id = 27;

    reserved 28 to 49;              // v2 占位

    // === v3 新增：图元可见性 / 锁定 ===
    // 3D 场景保存/恢复需要。旧文件缺失这两个字段时：
    //   visible 按 true 处理（SyEntity 构造默认可见）；
    //   locked  按 false 处理。
    // 使用 optional 是为了区分「旧文件没写」与「显式写了 false」。
    optional bool visible = 50;
    optional bool locked = 51;
}

// ---------------------------- 文档根消息 ----------------------------

// .sy 文件的完整内容
message SanYiDocument {
    DocumentMetadata metadata = 1;   // 文档元信息
    repeated LayerData layers  = 2;   // 图层列表
    repeated EntityData entities = 3; // 图元列表
    HardwareInfo hardware      = 4;   // [legacy] v1 硬件快照，只读
    repeated GroupData groups  = 5;   // 群组列表

    // === v2 新增 ===
    repeated ProcessData processes = 6;   // 工艺列表（加工参数的一等载体）
    ProjectSettings project_settings = 7; // 工程级设置（机器引用、默认工艺）

    // === 扩展预留 ===
    reserved 8 to 99;                 // v2 之后的常规扩展位
    reserved 100 to 200;              // 为未来大版本扩展预留字段号
}